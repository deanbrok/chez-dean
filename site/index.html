<head>

<title>Dean&rsquo;s</title>
<meta name="description" content="Dean's: a small basement jazz bar, coffee by day and records by night. Records are posts, books are reading lists, bottles are projects.">
<meta name="theme-color" content="#0b0705">

<meta name="robots" content="noindex">
<link rel="icon" href="./cat_emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Oswald:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Courier+Prime&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap">

<body class="is-night">
<canvas id="gl" tabindex="0" aria-label="A small basement jazz bar seen from a bar stool: a counter, a turntable, a wall of records, a cat"></canvas>
<div id="vignette" aria-hidden="true"></div>

<header id="sign">
  <h1><i class="emblem" aria-hidden="true"></i><span>Dean&rsquo;s</span></h1>
  <p id="subtitle">Records, whisky, and the hours after closing.</p>
</header>

<nav id="dial" aria-label="Places in the bar">
  <div class="scale" aria-hidden="true"></div>
  <div class="stations"></div>
  <i class="needle" aria-hidden="true"></i>
</nav>

<div id="tools">
  <button id="snd" type="button" aria-pressed="false" title="Sound: off"><span aria-hidden="true">&#9834;</span><b class="sr">Sound</b></button>
  <button id="sky" type="button" title="Day and night: following your clock"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1"/></g><path class="moon" d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5z"/></svg><em class="auto">auto</em><b class="sr">Day and night</b></button>
  <button id="info" type="button" aria-expanded="false" aria-controls="help" title="How to move around">i</button>
</div>
<div id="help" role="dialog" aria-label="How to move around"></div>

<div id="tip" role="status" aria-live="polite"></div>
<div id="marks"></div>
<p id="whisper" aria-live="polite"></p>

<aside id="panel" aria-hidden="true" role="dialog" aria-label="Reading">
  <div class="sheet">
    <button id="close" type="button" aria-label="Close">&times;</button>
    <div id="panel-body"></div>
  </div>
</aside>

<div id="loading"><div>
  <i class="emblem" aria-hidden="true"></i>
  <div class="t">Unlocking the door&hellip;</div>
  <div class="s">Dean&rsquo;s &middot; B1</div>
  <div class="bar"><i id="bar"></i></div>
  <p class="err" id="err"></p>
</div></div>

<noscript><p class="noscript">This room needs JavaScript and WebGL. The door is otherwise locked.</p></noscript>
<script type="module" src="./main.js"></script>
</body>
</html>
